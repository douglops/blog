{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ config.title }}{% endblock title %}

{% block content %}
<article>
  <h1 id="top">{{ page.title }}</h1>
  <p class="post-date">{{ page.date | date(format="%B %-d, %Y") }}</p>
  {{ page.content | safe }}
  <a href="#top" class="back-to-top" aria-label="Back to top">&uarr; Back to top</a>
</article>
{% endblock content %}
